version: '3.8'

services:
  # Laravel Admin Application
  laravel:
    build:
      context: ./admin.soilsync.shop
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./admin.soilsync.shop:/var/www/html
    environment:
      - APP_ENV=local
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_DATABASE=laravel
      - DB_USERNAME=root
      - DB_PASSWORD=password
    depends_on:
      - mysql
      - farmos-db
    networks:
      - farm-network

  # MySQL Database for Laravel
  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: laravel
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - farm-network

  # farmOS Database (separate from Laravel DB)
  farmos-db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: farmos_password
      MYSQL_DATABASE: farmos
    volumes:
      - farmos_data:/var/lib/mysql
    networks:
      - farm-network

  # farmOS Application
  farmos:
    image: farmos/farmos:3.x
    ports:
      - "8080:80"
    environment:
      FARMOS_DB_HOST: farmos-db
      FARMOS_DB_NAME: farmos
      FARMOS_DB_USER: root
      FARMOS_DB_PASS: farmos_password
    depends_on:
      - farmos-db
    volumes:
      - farmos_files:/opt/drupal/web/sites/default/files
    networks:
      - farm-network

  # FieldKit PWA
  fieldkit:
    build:
      context: ./fieldkit.soilsync.shop
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./fieldkit.soilsync.shop:/app
    networks:
      - farm-network

  # AI Service
  ai-service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./ai_service:/app
    environment:
      - PYTHONPATH=/app
    networks:
      - farm-network

  # WordPress (Customer Portal)
  wordpress:
    image: wordpress:latest
    ports:
      - "8081:80"
    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: root
      WORDPRESS_DB_PASSWORD: password
    volumes:
      - ./httpdocs:/var/www/html
      - wordpress_data:/var/www/html/wp-content
    depends_on:
      - mysql
    networks:
      - farm-network

  # Redis for caching and queues
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - farm-network

volumes:
  mysql_data:
  farmos_data:
  farmos_files:
  wordpress_data:

networks:
  farm-network:
    driver: bridge